# 検証（docs/analysis-plan.md §6）と個人情報の検査を毎回実行する。外部の Action はコミット SHA で固定する。
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # 個人情報の検査で全コミットを確かめるため
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - name: Install Japanese font for figures
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends fonts-noto-cjk
      - run: uv sync --locked
      - name: Check privacy
        run: python3 scripts/check_privacy.py
        env:
          PRIVACY_DENYLIST: ${{ secrets.PRIVACY_DENYLIST }}
          # 式をシェルに直接埋め込まず、環境変数として渡す（PR の本文によるコマンドの注入を防ぐ）
          PR_TEXT: ${{ github.event.pull_request.title }} ${{ github.event.pull_request.body }}
      - name: Lint
        run: uv run ruff check . && uv run ruff format --check .
      - name: Tests (V-01〜V-06)
        run: uv run pytest
      - name: Pipeline runs end to end
        run: uv run space-analysis
      - name: Processed data and report are up to date
        run: git diff --exit-code -- data/processed REPORT.md
